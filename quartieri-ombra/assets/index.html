<!doctype html><html lang="it"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Quartieri d'Ombra — Asset Library</title><style>*{box-sizing:border-box}body{margin:0;background:#171412;color:#e9d2af;font:15px Georgia,serif}header{padding:18px;text-align:center;border-bottom:6px ridge #584532;background:#221a18}h1{margin:0;color:#d7b27a;letter-spacing:.08em}p{color:#cab597;line-height:1.5}main{padding:20px;max-width:1150px;margin:auto}h2{font-size:19px;border-bottom:1px solid #5d4732;padding:8px}.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(145px,1fr));gap:10px}.asset{border:3px ridge #70583a;background:#27211f;text-align:center;padding:8px;min-height:166px}.asset img{height:100px;max-width:100%;object-fit:contain;image-rendering:pixelated;background:radial-gradient(#38302a,#171412)}.asset small{display:block;font-size:11px;margin-top:5px;color:#d9c8af;word-break:break-word}.asset a{color:#e4be83}.foot{margin:25px 0;color:#a18e7e}</style></head><body><header><h1>QUARTIERI D'OMBRA</h1><p>ARCHIVIO ASSET · RTS ISOMETRICO 1998–2003</p></header><main><p>Elementi effettivamente caricati su GitHub. Gli sprite sono singoli pezzi di gioco e non una schermata statica.</p><div id="list"></div><p class="foot"><a href="../">← Torna al gioco</a></p></main><script>fetch('./manifest.json').then(r=>r.json()).then(m=>{const group={};for(const a of m.assets){(group[a.type]??=[]).push(a)}for(const [cat,arr] of Object.entries(group)){const section=document.createElement('section');const head=document.createElement('h2');head.textContent=cat;section.append(head);const wrap=document.createElement('div');wrap.className='cards';for(const a of arr){const card=document.createElement('div');card.className='asset';const img=document.createElement('img');img.src=a.file;img.alt=a.id;const title=document.createElement('small');title.textContent=a.id;const link=document.createElement('a');link.href=a.file;link.append(img);card.append(link,title);wrap.append(card)}section.append(wrap);document.querySelector('#list').append(section)}}).catch(e=>document.querySelector('#list').textContent='Catalogo non disponibile: '+e.message);</script></body></html>
