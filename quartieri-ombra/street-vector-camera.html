<!doctype html>
<html lang="it"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<title>Quartieri d'Ombra — Esperimento visuale stradale</title>
<style>
:root{color-scheme:dark;font-family:system-ui,sans-serif;background:#171612;color:#f4dfbc}
*{box-sizing:border-box}body{margin:0;overflow:hidden}#scene{position:absolute;inset:0;width:100%;height:100%;touch-action:none;background:linear-gradient(#343b3d,#6a6353 65%,#3b3329)}
header{position:absolute;top:0;left:0;right:0;z-index:2;padding:12px 16px;background:linear-gradient(#171612ed,#17161200);pointer-events:none}
h1{font:700 18px Georgia,serif;margin:0}header small{color:#d5bb91}
nav{position:absolute;bottom:0;left:0;right:0;z-index:2;background:#211b17eb;border-top:1px solid #8a6d48;padding:10px;display:flex;align-items:center;gap:12px;flex-wrap:wrap}
button,a{background:#43382b;color:#f7dfb8;border:1px solid #96764a;border-radius:7px;padding:9px;text-decoration:none;font:inherit}
label{display:flex;align-items:center;gap:6px;font-size:12px}input{accent-color:#d8b67d;max-width:110px}
#status{position:absolute;top:55px;left:16px;z-index:2;font-size:12px;background:#1c1713d9;padding:8px;border:1px solid #86694b;border-radius:6px;max-width:min(400px,85vw)}
#hint{font-size:11px;color:#dbc39b}
</style>
<script src="./board-world.js" defer></script>
<script src="./street-vector-camera.js" defer></script>
</head><body>
<svg id="scene" xmlns="http://www.w3.org/2000/svg" aria-label="Prototipo 3D vettoriale a livello stradale con rotazione e zoom"></svg>
<header><h1>QUARTIERI D'OMBRA · LAB 3D</h1><small>Cross Street · geometria reale, nessun asset raster</small></header>
<div id="status" role="status">Caricamento geometria…</div>
<nav>
<button id="reset">Reimposta</button>
<label>Altezza <input id="height" type="range" min="12" max="110" value="25" step="1"><output id="height-value">25</output></label>
<label>Zoom <input id="distance" type="range" min="95" max="500" value="220" step="5"><output id="distance-value">220</output></label>
<button id="quarter">Ruota 90°</button>
<a href="./street-webgl.html">Nuovo LAB WebGL</a>
<a href="./board-preview.html">Plancia originale</a>
<span id="hint">Trascina per ruotare · pizzica per zoom · tocca un palazzo</span>
</nav></body></html>
