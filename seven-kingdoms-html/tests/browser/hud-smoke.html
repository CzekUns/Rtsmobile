<!doctype html><html><meta charset="utf-8"><title>SKH HUD browser smoke</title><body><output id="result">PENDING</output><iframe id="game" src="../../index.html" style="width:960px;height:600px"></iframe><script>
const output=document.getElementById('result');
const frame=document.getElementById('game');
const delay=ms=>new Promise(r=>setTimeout(r,ms));
async function run(){
 const d=frame.contentDocument,w=frame.contentWindow;
 const get=id=>d.getElementById(id);
 const assert=(condition,message)=>{if(!condition)throw Error(message)};
 await delay(700);
 assert(get('world')&&get('sidebarToggle')&&get('touchModifier'),'required game controls absent');
 const toggle=get('sidebarToggle'),sidebar=get('orderSidebar');
 assert(toggle.getAttribute('aria-expanded')!==null,'ORDINI missing expanded state');
 const initial=toggle.getAttribute('aria-expanded');
 toggle.click();
 assert(toggle.getAttribute('aria-expanded')!==initial,'ORDINI did not toggle');
 assert(sidebar.inert===(toggle.getAttribute('aria-expanded')==='false'),'ORDINI inert mismatch');
 toggle.click();
 assert(toggle.getAttribute('aria-expanded')===initial,'ORDINI did not restore state');
 const reports=d.querySelector('[data-report="towns"]');
 reports.click();
 await delay(100);
 assert(get('reportDialog').open,'report dialog failed to open');
 get('closeReport').click();
 await delay(100);
 assert(!get('reportDialog').open,'report dialog failed to close');
 const commands=get('touchControlsToggle');
 commands.click();
 assert(commands.getAttribute('aria-expanded')==='true','COMANDI did not expand');
 commands.click();
 assert(commands.getAttribute('aria-expanded')==='false','COMANDI did not collapse');
 assert(get('fullscreenBtn')&&get('gameMenu')&&get('minimap'),'core HUD controls missing');
 // Exercise the real game keyboard/save and pause controls, not only DOM presence.
 const pause=get('pauseBtn'),date=get('date'),ticker=get('ticker');
 assert(date.textContent.trim().length>0,'game date not rendered');
 pause.click();
 assert(pause.getAttribute('title')||pause.textContent,'pause control became empty');
 pause.click();
 // The first launch opens the instructions modal; shortcuts are deliberately disabled while it is open.
 const help=get('helpDialog');
 if(help.open)help.close();
 d.body.focus();
 d.dispatchEvent(new w.KeyboardEvent('keydown',{key:'s',bubbles:true,cancelable:true}));
 assert(/salvat/i.test(ticker.textContent),'keyboard save did not report a result after dismissing instructions');
 const menu=get('menuBtn');
 menu.click();
 assert(menu.getAttribute('aria-expanded')==='true'&&!get('gameMenu').hidden,'game menu did not open');
 menu.click();
 assert(menu.getAttribute('aria-expanded')==='false'&&get('gameMenu').hidden,'game menu did not close');
 output.textContent='PASS: ORDINI, reports, COMANDI, menu, pause, save and core HUD';
}
frame.addEventListener('load',()=>run().catch(e=>output.textContent='FAIL: '+e.message));
setTimeout(()=>{if(output.textContent==='PENDING')output.textContent='FAIL: browser smoke timeout'},12000);
</script></body></html>
