<!doctype html>
<html lang="it"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>SKH-QA-001 · live game viewport</title>
<style>html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#161616}iframe{display:block;width:100vw;height:100vh;border:0}#qa{position:fixed;top:0;right:0;z-index:9999;font:10px monospace;background:#111;color:#fff;padding:2px}</style></head>
<body><iframe id="game" src="../../index.html?chinese=1" title="Actual Seven Kingdoms game"></iframe><output id="qa" data-result="pending">PENDING</output>
<script>
const frame=document.getElementById('game'),qa=document.getElementById('qa');
const wait=ms=>new Promise(resolve=>setTimeout(resolve,ms));
frame.addEventListener('load',async()=>{
 try{
  await wait(1200);
  const d=frame.contentDocument,w=frame.contentWindow;
  const get=id=>d.getElementById(id);
  if(get('helpDialog')?.open)get('helpDialog').close();
  const commands=get('touchControlsToggle');commands.click();
  await wait(300);
  const required=['world','minimap','orderSidebar','touchJoystick','touchModifier','touchControlsToggle','sidebarToggle','date','cash'];
  for(const id of required){const el=get(id);if(!el||!el.getBoundingClientRect().width)throw Error(id+' missing/hidden');}
  if(commands.getAttribute('aria-expanded')!=='true')throw Error('COMANDI closed');
  const canvas=get('world');
  const pixels=canvas.getContext('2d').getImageData(0,0,canvas.width,canvas.height).data;
  let opaque=0;for(let i=3;i<pixels.length;i+=4)if(pixels[i])opaque++;
  if(opaque<1000)throw Error('World canvas not rendered: '+opaque);
  const ticker=get('ticker');
  if(!ticker)throw Error('ticker missing');
  // Freeze the visible notification to compare identical UI states at 1x/2x.
  // A short message avoids clipping unrelated to HUD geometry.
  const baseline='QA · Corinto';
  // Do not observe/rewrite ticker mutations: the game continuously updates this
  // node and a MutationObserver can keep Chromium busy during 2x screenshots.
  // Present a fixed visual label while leaving the game's DOM updates untouched.
  const css=d.createElement('style');
  css.textContent='#ticker{font-size:0!important}#ticker::after{content:"QA · Corinto";font-size:12px;white-space:nowrap}';
  d.head.appendChild(css);
  // Deterministic reference labels in CSS pixels. The game's animated Canvas
  // cannot provide identical pixels across separate Chromium processes; these
  // DOM metrics isolate device-scale-dependent text geometry instead.
  const reference=d.createElement('div');
  reference.id='qa-label-reference';
  reference.style.cssText='position:fixed;left:12px;top:12px;z-index:99999;visibility:hidden;pointer-events:none;font:12px Arial,sans-serif;white-space:nowrap';
  reference.innerHTML='<span>Forte</span><span style="margin-left:16px">Mercato</span>';
  d.body.appendChild(reference);
  const spans=[...reference.querySelectorAll('span')];
  const sizes=spans.map(el=>{const r=el.getBoundingClientRect();return [r.width,r.height].map(n=>Number(n.toFixed(3)))});
  qa.dataset.labelMetrics=JSON.stringify(sizes);
  qa.dataset.ticker=baseline;
  qa.dataset.result='ready';qa.dataset.canvasPixels=String(opaque);
  qa.textContent='PASS · actual game HUD + world + COMANDI';
  // Keep diagnostic state readable by --dump-dom but out of screenshots.
  qa.style.display='none';
 }catch(e){qa.dataset.result='failed';qa.textContent='FAIL: '+e.message}
});
setTimeout(()=>{if(qa.dataset.result==='pending'){qa.dataset.result='failed';qa.textContent='FAIL: game timeout'}},11000);
</script></body></html>
