<!doctype html>
<html lang="it">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
  <meta name="theme-color" content="#171a16">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="stylesheet" href="./app.css?v=24">
  <style>
    .selection-card{
      left:auto!important;
      right:8px!important;
      width:min(330px,calc(100% - 110px));
      min-width:0!important;
      max-width:none!important;
    }
  </style>
  <title>Terra Italica — RTS Mobile</title>
</head>
<body>
  <main id="app" class="app-shell">
    <header class="hud-top" aria-label="Stato della comunità">
      <div class="identity">
        <strong>TERRA ITALICA <small style="font-size:8px;opacity:.55;letter-spacing:.08em">BUILD 28</small></strong>
        <span id="dateLabel">1 Marzo · 1000 a.C.</span>
      </div>
      <div class="resources" id="resourceBar">
        <span><i class="dot food"></i><b id="foodVal">0</b><small>cibo</small></span>
        <span><i class="dot wood"></i><b id="woodVal">0</b><small>legno</small></span>
        <span><i class="dot stone"></i><b id="stoneVal">0</b><small>pietra</small></span>
        <span><i class="dot iron"></i><b id="ironVal">0</b><small>ferro</small></span>
      </div>
    </header>

    <section class="world-wrap" id="worldWrap">
      <canvas id="world" aria-label="Mappa di gioco"></canvas>
      <div class="map-controls" aria-label="Controlli mappa">
        <button id="zoomIn" type="button" aria-label="Aumenta zoom">+</button>
        <button id="zoomOut" type="button" aria-label="Riduci zoom">−</button>
        <button id="pauseBtn" type="button" aria-label="Pausa">Ⅱ</button>
      </div>
      <button id="touchModifier" class="touch-modifier" type="button" aria-label="Tieni premuto per modalità secondaria" aria-pressed="false"><span>MOD</span></button>
      <div id="message" class="message" role="status"></div>
      <div id="selectionCard" class="selection-card hidden"></div>
      <div id="gameOver" class="game-over hidden">
        <div>
          <small>FINE DELLA COMUNITÀ</small>
          <h1>L'insediamento è caduto</h1>
          <p>Il mondo resta deterministico: puoi ricominciare dalla stessa geografia o generare un territorio nuovo.</p>
          <button id="restartSame" type="button">Ricomincia</button>
          <button id="restartNew" type="button" class="secondary">Nuovo territorio</button>
        </div>
      </div>
    </section>

    <nav class="command-dock" aria-label="Comandi">
      <div class="dock-tabs">
        <button class="dock-tab active" data-panel="people" type="button">Comunità</button>
        <button class="dock-tab" data-panel="orders" type="button">Ordini</button>
        <button class="dock-tab" data-panel="build" type="button">Costruisci</button>
        <button class="dock-tab" data-panel="worldPanel" type="button">Mondo</button>
      </div>
      <div id="people" class="dock-panel active"></div>
      <div id="orders" class="dock-panel">
        <button data-order="move" type="button"><b>Sposta</b><span>tocca il terreno</span></button>
        <button data-order="gather" type="button"><b>Raccogli</b><span>tocca una risorsa</span></button>
        <button data-order="farm" type="button"><b>Coltiva</b><span>tocca un campo</span></button>
        <button data-order="tame" type="button"><b>Domestica</b><span>tocca una pecora</span></button>
        <button data-order="attack" type="button"><b>Attacca</b><span>tocca una minaccia</span></button>
        <button data-order="cancel" type="button"><b>Libera</b><span>annulla il compito</span></button>
      </div>
      <div id="build" class="dock-panel">
        <button data-build="road" type="button"><b>Sentiero</b><span>1 legno</span></button>
        <button data-build="warehouse" type="button"><b>Magazzino</b><span>18L · 8P</span></button>
        <button data-build="house" type="button"><b>Distretto</b><span>24L · 10P</span></button>
        <button data-build="farm" type="button"><b>Campo</b><span>6 legno</span></button>
        <button data-build="palisade" type="button"><b>Palizzata</b><span>4 legno</span></button>
        <button data-build="tower" type="button"><b>Torre</b><span>14L · 8P</span></button>
      </div>
      <div id="worldPanel" class="dock-panel world-actions">
        <button id="saveBtn" type="button"><b>Salva</b><span>locale sul dispositivo</span></button>
        <button id="loadBtn" type="button"><b>Carica</b><span>ultimo salvataggio</span></button>
        <button id="newWorldBtn" type="button"><b>Nuovo mondo</b><span>genera nuova mappa</span></button>
        <button id="centerBtn" type="button"><b>Centro</b><span>torna al villaggio</span></button>
      </div>
    </nav>
  </main>

  <script src="./game.js?v=28"></script>
  <script src="./p16-render.js?v=24"></script>
  <script src="./asset-render.js?v=28"></script>
  <script src="./touch-modifier.js?v=28"></script>
</body>
</html>
