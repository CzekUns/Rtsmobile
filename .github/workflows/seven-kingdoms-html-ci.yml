name: Seven Kingdoms HTML - JS tests and stream scope

on:
  push:
    paths:
      - 'seven-kingdoms-html/**'
      - '.github/workflows/seven-kingdoms-html-ci.yml'
  pull_request:
    paths:
      - 'seven-kingdoms-html/**'
      - '.github/workflows/seven-kingdoms-html-ci.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sevenkingdoms-html-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  js-tests-and-stream-scope:
    name: JS tests & stream scope
    runs-on: ubuntu-latest
    steps:
      - name: Checkout full history for PR scope comparisons
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Syntax checks for native JS
        run: npm --prefix seven-kingdoms-html run check
      - name: Node unit tests (recursively discovered)
        run: npm --prefix seven-kingdoms-html test
      - name: Chromium HUD interaction smoke
        env:
          CHROME_BIN: google-chrome
        run: node seven-kingdoms-html/tests/browser/run-hud-smoke.mjs
      - name: Chromium original PLANT gallery HTTP and screenshot 1x/2x
        env:
          CHROME_BIN: google-chrome
          PLANT_QA_SCREENSHOT: ${{ runner.temp }}/plant-1x-2x.png
          PLANT_QA_SCENE_SCREENSHOT: ${{ runner.temp }}/plant-worldview-1x-2x.png
        run: |
          if test -f seven-kingdoms-html/assets/previews/plant-original.png; then
            node seven-kingdoms-html/tests/browser/run-plant-visual-smoke.mjs
          else
            echo "PLANT asset not present on this branch; gallery QA skipped."
          fi
      - name: Upload real Chromium PLANT gallery screenshot
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: skh-terrain-002-chromium-plant-1x-2x
          path: |
            ${{ runner.temp }}/plant-1x-2x.png
            ${{ runner.temp }}/plant-worldview-1x-2x.png
          if-no-files-found: warn
          retention-days: 14
      - name: Chromium original landscape depth and occlusion 1x/2x
        if: github.head_ref == 'agent/skh-integration/original-landscape-overlays' || github.ref == 'refs/heads/agent/skh-integration/original-landscape-overlays'
        env:
          CHROME_BIN: google-chrome
          LANDSCAPE_QA_SCREENSHOT: ${{ runner.temp }}/landscape-occlusion-1x-2x.png
        run: node seven-kingdoms-html/tests/browser/run-landscape-occlusion.mjs
      - name: Upload landscape occlusion screenshot
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: skh-terrain-002-landscape-occlusion-1x-2x
          path: ${{ runner.temp }}/landscape-occlusion-1x-2x.png
          if-no-files-found: warn
          retention-days: 14
      - name: Enforce ownership on agent branches only
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_BRANCH: ${{ github.head_ref }}
        run: node seven-kingdoms-html/tools/check-workstream.mjs

  original-plant-atlas:
    name: Original 7KAA PLANT atlas acquisition
    if: github.ref == 'refs/heads/agent/skh-integration/original-landscape-overlays' || github.head_ref == 'agent/skh-integration/original-landscape-overlays'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Capture bounded original PLANT compressed-record diagnostics
        run: |
          node seven-kingdoms-html/tools/assets/fetch-plant-resources.mjs "$RUNNER_TEMP/skh-plant-source"
          node seven-kingdoms-html/tools/assets/inspect-plant-compression.mjs "$RUNNER_TEMP/skh-plant-source/PLANTBM1.RES" "$RUNNER_TEMP/skh-plant-source/I_PLANT1.RES" "$RUNNER_TEMP/skh-plant-source/plant-compression-diagnostics.json"
      - name: Upload compressed PLANT record diagnostics even if atlas export fails
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: skh-terrain-002-compression-diagnostics
          path: ${{ runner.temp }}/skh-plant-source/plant-compression-diagnostics.json
          if-no-files-found: warn
          retention-days: 14
      - name: Acquire pinned original PLANT resources and render reproducible atlas
        run: node seven-kingdoms-html/tools/assets/build-original-plant-atlas.mjs "$RUNNER_TEMP/skh-plant-atlas"
      - name: Upload original PNG, manifest with SHA-256, and 1x/2x QA preview
        uses: actions/upload-artifact@v4
        with:
          name: skh-terrain-002-original-plant-atlas
          path: |
            ${{ runner.temp }}/skh-plant-atlas/plant-original.png
            ${{ runner.temp }}/skh-plant-atlas/plant-original.json
            ${{ runner.temp }}/skh-plant-atlas/plant-original-qa.html
          if-no-files-found: error
          retention-days: 14
      - name: Publish source-verified PLANT atlas to task branch
        # The export is deterministic. Only the task branch push may write.
        # No PR/fork token is granted write access.
        if: github.event_name == 'push' && github.ref == 'refs/heads/agent/skh-integration/original-landscape-overlays'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          mkdir -p seven-kingdoms-html/assets/previews seven-kingdoms-html/assets/manifests
          cp "$RUNNER_TEMP/skh-plant-atlas/plant-original.png" seven-kingdoms-html/assets/previews/plant-original.png
          cp "$RUNNER_TEMP/skh-plant-atlas/plant-original.json" seven-kingdoms-html/assets/manifests/plant-original.json
          git add seven-kingdoms-html/assets/previews/plant-original.png seven-kingdoms-html/assets/manifests/plant-original.json
          if git diff --cached --quiet; then
            echo "Original PLANT atlas already matches committed bytes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "assets(7kaa): publish verified original PLANT atlas"
          # Never force-push or overwrite concurrent work.
          git push origin "HEAD:refs/heads/agent/skh-integration/original-landscape-overlays"

  original-rock-atlas:
    name: Original 7KAA ROCK atlas acquisition
    if: github.ref == 'refs/heads/agent/skh-integration/original-landscape-overlays' || github.head_ref == 'agent/skh-integration/original-landscape-overlays'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Acquire six pinned ROCK archives and export original indexed atlas
        run: node seven-kingdoms-html/tools/assets/build-original-rock-atlas.mjs "$RUNNER_TEMP/skh-rock-atlas"
      - name: Upload source-verified ROCK atlas and SHA-256 manifest
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: skh-terrain-002-original-rock-atlas
          path: |
            ${{ runner.temp }}/skh-rock-atlas/rock-original.png
            ${{ runner.temp }}/skh-rock-atlas/rock-original.json
          if-no-files-found: warn
          retention-days: 14
      - name: Publish original ROCK atlas to task branch
        if: github.event_name == 'push' && github.ref == 'refs/heads/agent/skh-integration/original-landscape-overlays'
        run: |
          set -euo pipefail
          mkdir -p seven-kingdoms-html/assets/previews seven-kingdoms-html/assets/manifests
          cp "$RUNNER_TEMP/skh-rock-atlas/rock-original.png" seven-kingdoms-html/assets/previews/rock-original.png
          cp "$RUNNER_TEMP/skh-rock-atlas/rock-original.json" seven-kingdoms-html/assets/manifests/rock-original.json
          git add seven-kingdoms-html/assets/previews/rock-original.png seven-kingdoms-html/assets/manifests/rock-original.json
          if git diff --cached --quiet; then
            echo "Original ROCK atlas already matches committed bytes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "assets(7kaa): publish verified original ROCK atlas"
          git push origin "HEAD:refs/heads/agent/skh-integration/original-landscape-overlays"

  original-second-family:
    name: Original 7KAA second-family extraction
    if: github.ref == 'refs/heads/agent/skh-integration/original-buildings-units' || github.head_ref == 'agent/skh-integration/original-buildings-units'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Acquire pinned GPL resources and render non-Norman building
        run: node seven-kingdoms-html/tools/assets/acquire-original-family.mjs --out "$RUNNER_TEMP/skh-second-family"
      - name: Validate extracted PNG and provenance
        run: |
          node --input-type=module -e '
            import {readFile} from "node:fs/promises";
            import {join} from "node:path";
            const dir=join(process.env.RUNNER_TEMP,"skh-second-family");
            const m=JSON.parse(await readFile(join(dir,"firm.json"),"utf8"));
            if(m.raceCode==="NORMAN" || !m.decoded || m.visuallyVerified || !m.bitmaps?.length || !m.modes?.length) throw Error("Invalid second-family manifest");
            for(const key of ["tables","bitmap","palette"]) if(!/^[a-f0-9]{64}$/.test(m.source?.sha256?.[key]||"")) throw Error("Missing source SHA-256 "+key);
            for(const row of [...m.bitmaps,...m.modes]) {
              const data=await readFile(join(dir,row.path));
              if(data.subarray(0,8).toString("hex")!=="89504e470d0a1a0a") throw Error("Invalid PNG "+row.path);
            }
            console.log(JSON.stringify({race:m.raceCode,bitmaps:m.bitmaps.length,modes:m.modes.length,source:m.source.sha256},null,2));
          '
      - name: Upload authentic PNGs and manifest for integration
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: skh-original-second-family
          path: ${{ runner.temp }}/skh-second-family/
          if-no-files-found: warn
          retention-days: 14
      - name: Publish verified Chinese building PNGs and manifest to task branch
        if: github.event_name == 'push' && github.ref == 'refs/heads/agent/skh-integration/original-buildings-units'
        run: |
          set -euo pipefail
          src="$RUNNER_TEMP/skh-second-family"
          dst="seven-kingdoms-html/assets/original/chinese-base"
          test -s "$src/firm.json"
          mkdir -p "$dst"
          # The preceding provenance check must have passed; publish only its exact outputs.
          find "$src" -maxdepth 1 -type f -name '*.png' -exec cp '{}' "$dst/" \;
          cp "$src/firm.json" "$dst/firm.json"
          git add "$dst"
          if git diff --cached --quiet; then
            echo "Authentic Chinese assets already committed."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "assets(7kaa): publish original Chinese building family"
          git push origin "HEAD:refs/heads/agent/skh-integration/original-buildings-units"
